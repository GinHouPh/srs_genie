name: Deploy SRS Genie to Serverbyt

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build production bundle
        run: npm run build

      - name: 🚀 Deploy to Serverbyt via FTP/SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SERVERBYT_FTP_SERVER }}
          username: ${{ secrets.SERVERBYT_FTP_USERNAME }}
          password: ${{ secrets.SERVERBYT_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
